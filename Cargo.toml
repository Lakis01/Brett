[package]
name = "brett"
version = "0.1.6"
edition = "2024"
rust-version = "1.97"
description = "Brett: Chess Preparation and Database Suite"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
cozy-chess = "0.3.4"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "gif"] }
memmap2 = "0.9"
cbvault-format = "0.1.4"
anyhow = "1"
arboard = "3"
deunicode = "1.6"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2.12"
webbrowser = "1.2"
rusqlite = { version = "0.33", features = ["bundled"] }
rayon = "1.12.0"
regex = "1.11"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
