[package]
name = "brett"
version = "0.3.2"
edition = "2024"
rust-version = "1.97"
description = "Brett: Chess Preparation and Database Suite"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
cozy-chess = "0.3.4"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "gif"] }
memmap2 = "0.9"
cbvault-format = "0.1.4"
anyhow = "1"
deunicode = "1.6"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2.12"
rusqlite = { version = "0.33", features = ["bundled"] }
rayon = "1.12.0"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"

[profile.dev]
opt-level = 1
# Line tables keep file:line backtraces but drop full DWARF type info, which
# made every test/example binary 300-500 MB and grew target/ to ~90 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
