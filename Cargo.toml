[package]
name = "brett"
version = "0.1.0"
edition = "2024"
description = "Brett: native Linux chess preparation workspace for PGN/SCID databases"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
shakmaty = "0.30"
pgn-reader = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
memmap2 = "0.9"
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
